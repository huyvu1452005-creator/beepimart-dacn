name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: beepi_admin
          POSTGRES_PASSWORD: BeepiSecurePassword2026
          POSTGRES_DB: beepimart_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_USER: beepi_admin
          DB_PASSWORD: BeepiSecurePassword2026
          DB_NAME: beepimart_db
          DB_PORT: 5432
          JWT_SECRET: test_secret
        run: npm test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker-compose build

      - name: Test Docker compose
        run: |
          docker-compose up -d
          sleep 30
          curl -f http://localhost/api/health || exit 1
          docker-compose down
