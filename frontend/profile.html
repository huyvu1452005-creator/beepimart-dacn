<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài Khoản Của Tôi - BeePiMart</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #f7f8fa;
    font-family: 'Inter', system-ui, sans-serif;
    color: #2c3e50;
    font-size: 15px;
    line-height: 1.55;
}

.container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 20px; }

/* HEADER */
.header-wrapper {
    background: linear-gradient(135deg, #008543 0%, #00b35c 100%);
    padding: 14px 0;
    position: sticky;
    top: 0;
    z-index: 900;
}
.header-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
}
.navbar-brand {
    font-size: 25px;
    font-weight: 800;
    text-decoration: none;
    color: white;
}
.navbar-brand span { color: #FFB800; }

.btn {
    padding: 9px 20px;
    border-radius: 22px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    display: inline-block;
}
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e63e40; }
.btn-success { background: #008543; color: #fff; }
.btn-success:hover { background: #006b36; }
.btn-outline { background: #fff; color: #008543; border: 2px solid #008543; }
.btn-outline:hover { background: #008543; color: #fff; }
.btn-light { background: rgba(255, 255, 255, 0.2); color: #fff; border: 2px solid rgba(255, 255, 255, 0.4); }
.btn-light:hover { background: rgba(255, 255, 255, 0.3); }

.breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 22px 0 16px;
    font-size: 14px;
    color: #64748b;
}
.breadcrumb a { color: #008543; text-decoration: none; font-weight: 600; }

/* PROFILE HEADER */
.profile-header {
    background: linear-gradient(135deg, #008543, #00b35c);
    border-radius: 16px;
    padding: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    color: #fff;
    margin-bottom: 22px;
}

.avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFB800, #ff9500);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    border: 3px solid rgba(255, 255, 255, 0.4);
}

.profile-header-info h1 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 4px;
}
.profile-header-info p { font-size: 14px; opacity: 0.9; }

/* TABS */
.tabs {
    display: flex;
    background: #fff;
    padding: 6px;
    border-radius: 14px;
    border: 1px solid #e8ecf0;
    gap: 6px;
    margin-bottom: 22px;
    overflow-x: auto;
}
.tab-btn {
    padding: 12px 22px;
    border: none;
    background: none;
    color: #64748b;
    font-weight: 600;
    cursor: pointer;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    white-space: nowrap;
}
.tab-btn.active { background: #008543; color: #fff; }

.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* CARD */
.card {
    background: #fff;
    border-radius: 14px;
    padding: 26px;
    border: 1px solid #e8ecf0;
}
.card-title {
    font-size: 17px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid #f0f4f8;
}

/* FORM */
.form-group { margin-bottom: 18px; }
.form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 8px;
}
.form-input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
}
.form-input:focus { border-color: #008543; }
.form-input:disabled { background: #f8fafc; color: #94a3b8; }

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}
@media (max-width: 640px) {
    .form-row { grid-template-columns: 1fr; }
    .profile-header { flex-direction: column; text-align: center; }
}

.form-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    padding-top: 8px;
    border-top: 1px solid #f1f5f9;
    margin-top: 20px;
}

/* ĐƠN HÀNG */
.order-filter {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 8px;
}
.filter-btn {
    padding: 8px 16px;
    border: 2px solid #e2e8f0;
    background: #fff;
    color: #64748b;
    border-radius: 20px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
}
.filter-btn.active {
    border-color: #008543;
    background: #f0f9f4;
    color: #008543;
}

.order-item {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    border: 1px solid #e8ecf0;
    margin-bottom: 14px;
}
.order-item:hover { border-color: #008543; }

.order-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid #f1f5f9;
    flex-wrap: wrap;
    gap: 8px;
}

.order-id { font-size: 16px; font-weight: 800; color: #1e293b; }
.order-time { font-size: 12.5px; color: #94a3b8; margin-top: 2px; }

.badge {
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
}
.badge.pending { background: #fff7e6; color: #d46b08; }
.badge.confirmed { background: #e0f2fe; color: #0369a1; }
.badge.waiting { background: #ede9fe; color: #7c3aed; }
.badge.shipping { background: #e6f7ff; color: #096dd9; }
.badge.completed { background: #f0fdf4; color: #16a34a; }
.badge.cancelled { background: #fef2f2; color: #dc2626; }

.order-items-list { padding: 8px 0; }
.order-line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 14px;
}
.order-line .thumb {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
}
.order-line .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
}
.order-line .info { flex: 1; }
.order-line .name { font-weight: 600; color: #1e293b; }
.order-line .qty { font-size: 12.5px; color: #64748b; }
.order-line .price { font-weight: 700; color: #ee4d2d; white-space: nowrap; }

.order-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    margin-top: 12px;
    border-top: 1px solid #f1f5f9;
    flex-wrap: wrap;
    gap: 10px;
}
.order-total { font-size: 15px; font-weight: 700; }
.order-total span { color: #ee4d2d; font-size: 18px; }
.order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.order-actions .btn { padding: 7px 14px; font-size: 12.5px; border-radius: 8px; }

.tag-fragile {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fef2f2;
    color: #dc2626;
    padding: 3px 10px;
    border-radius: 8px;
    font-size: 11.5px;
    font-weight: 700;
}

.empty {
    text-align: center;
    padding: 60px 20px;
    color: #94a3b8;
}
.empty .icon { font-size: 64px; opacity: 0.4; margin-bottom: 12px; }

/* MODAL */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal-box {
    background: #fff;
    border-radius: 18px;
    width: 100%;
    max-width: 440px;
}
.modal-head {
    padding: 20px 24px;
    border-bottom: 1px solid #e8ecf0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.modal-head h3 { font-size: 17px; font-weight: 700; }
.modal-body { padding: 20px 24px; }
.modal-foot {
    padding: 16px 24px;
    border-top: 1px solid #e8ecf0;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

/* TOAST */
.toast-container {
    position: fixed;
    top: 90px;
    right: 26px;
    z-index: 1100;
}
.toast {
    background: #1e293b;
    color: #fff;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 14px;
    min-width: 260px;
    margin-bottom: 10px;
}
.toast.success { background: linear-gradient(135deg, #008543, #00b35c); }
.toast.error { background: linear-gradient(135deg, #ef4444, #f87171); }
</style>
</head>
<body>

<div class="header-wrapper">
    <div class="header-container">
        <a href="index.html" class="navbar-brand"><span>BeePi</span>Mart</a>
        <div style="display:flex; gap:10px;">
            <a href="index.html" class="btn btn-light">Về Cửa Hàng</a>
            <button class="btn btn-danger" onclick="logout()">Thoát</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="breadcrumb">
        <a href="index.html">Trang chủ</a>
        <span>/</span>
        <span>Tài khoản</span>
    </div>

    <div class="profile-header">
        <div class="avatar" id="avatar">U</div>
        <div class="profile-header-info">
            <h1 id="header-name">Đang tải...</h1>
            <p id="header-email">...</p>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-info', this)">Thông Tin Cá Nhân</button>
        <button class="tab-btn" onclick="switchTab('tab-orders', this); loadMyOrders();">Đơn Hàng Của Tôi</button>
        <button class="tab-btn" onclick="switchTab('tab-password', this)">Đổi Mật Khẩu</button>
    </div>

    <!-- TAB THÔNG TIN -->
    <div class="tab-pane active" id="tab-info">
        <div class="card">
            <div class="card-title">Thông Tin Cá Nhân</div>
            <form onsubmit="saveProfile(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tên đăng nhập</label>
                        <input type="text" class="form-input" id="f-username" disabled>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Vai trò</label>
                        <input type="text" class="form-input" id="f-role" disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" class="form-input" id="f-fullname" placeholder="Nguyễn Văn A">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="f-email">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-input" id="f-phone">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Địa chỉ giao hàng mặc định</label>
                    <input type="text" class="form-input" id="f-address" placeholder="Số nhà, đường, phường, quận, thành phố">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-success" id="btn-save">Lưu Thay Đổi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- TAB ĐƠN HÀNG -->
    <div class="tab-pane" id="tab-orders">
        <div class="order-filter">
            <button class="filter-btn active" data-status="all" onclick="filterOrders('all', this)">Tất Cả</button>
            <button class="filter-btn" data-status="Chờ xử lý" onclick="filterOrders('Chờ xử lý', this)">Chờ xử lý</button>
            <button class="filter-btn" data-status="Đã xác nhận" onclick="filterOrders('Đã xác nhận', this)">Đã xác nhận</button>
            <button class="filter-btn" data-status="Đang giao" onclick="filterOrders('Đang giao', this)">Đang giao</button>
            <button class="filter-btn" data-status="Hoàn thành" onclick="filterOrders('Hoàn thành', this)">Hoàn thành</button>
            <button class="filter-btn" data-status="Đã hủy" onclick="filterOrders('Đã hủy', this)">Đã hủy</button>
        </div>
        <div id="orders-list">
            <div class="empty"><div class="icon">📦</div><p>Đang tải đơn hàng...</p></div>
        </div>
    </div>

    <!-- TAB ĐỔI MẬT KHẨU -->
    <div class="tab-pane" id="tab-password">
        <div class="card">
            <div class="card-title">Đổi Mật Khẩu</div>
            <form onsubmit="changePassword(event)">
                <div class="form-group">
                    <label class="form-label">Mật khẩu hiện tại *</label>
                    <input type="password" class="form-input" id="old-pass" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu mới *</label>
                    <input type="password" class="form-input" id="new-pass" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">Xác nhận mật khẩu mới *</label>
                    <input type="password" class="form-input" id="confirm-pass" required minlength="6">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-success">Đổi Mật Khẩu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- MODAL HỦY ĐƠN -->
<div class="modal-overlay" id="cancel-modal">
    <div class="modal-box">
        <div class="modal-head">
            <h3>Hủy Đơn Hàng</h3>
            <button style="background:none;border:none;font-size:18px;cursor:pointer;" onclick="closeCancelModal()">×</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="cancel-order-id">
            <div class="form-group">
                <label class="form-label">Lý do hủy (tùy chọn)</label>
                <input type="text" class="form-input" id="cancel-reason" placeholder="Ví dụ: Đổi ý, đặt nhầm...">
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-outline" onclick="closeCancelModal()">Không</button>
            <button class="btn btn-danger" onclick="confirmCancel()">Xác Nhận Hủy</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
const API_URL = '/api';
const token = localStorage.getItem('token');
if (!token) window.location.href = 'login.html';

let allOrders = [];
let currentFilter = 'all';

function toast(msg, type = 'success') {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function authHeaders() {
    return {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
    };
}

function fmtMoney(n) { return Number(n || 0).toLocaleString('vi-VN') + ' đ'; }

function logout() {
    localStorage.clear();
    window.location.href = 'login.html';
}

function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
}

// ============================================================
// LOAD PROFILE
// ============================================================
async function loadProfile() {
    try {
        const res = await fetch(`${API_URL}/users/me`, { headers: authHeaders() });
        const json = await res.json();
        const user = json.data || json;

        const displayName = user.full_name || user.username;
        document.getElementById('avatar').textContent = displayName.charAt(0).toUpperCase();
        document.getElementById('header-name').textContent = displayName;
        document.getElementById('header-email').textContent = user.email || 'Chưa có email';

        document.getElementById('f-username').value = user.username;
        document.getElementById('f-role').value =
            user.role === 'admin' ? 'Admin' :
            user.role === 'shipper' ? 'Shipper' : 'Customer';
        document.getElementById('f-fullname').value = user.full_name || '';
        document.getElementById('f-email').value = user.email || '';
        document.getElementById('f-phone').value = user.phone || '';
        document.getElementById('f-address').value = user.address || '';
    } catch (e) {
        toast('Không tải được thông tin', 'error');
    }
}

async function saveProfile(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-save');
    btn.disabled = true;

    const body = {
        full_name: document.getElementById('f-fullname').value.trim() || null,
        email: document.getElementById('f-email').value.trim() || null,
        phone: document.getElementById('f-phone').value.trim() || null,
        address: document.getElementById('f-address').value.trim() || null
    };

    try {
        const res = await fetch(`${API_URL}/users/me`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify(body)
        });
        const json = await res.json();
        if (!res.ok) {
            toast(json.error || 'Lỗi lưu', 'error');
            return;
        }
        toast('Cập nhật thành công!');
        loadProfile();
    } catch (e) {
        toast('Lỗi kết nối', 'error');
    } finally {
        btn.disabled = false;
    }
}

async function changePassword(e) {
    e.preventDefault();
    const oldP = document.getElementById('old-pass').value;
    const newP = document.getElementById('new-pass').value;
    const cfP = document.getElementById('confirm-pass').value;

    if (newP !== cfP) { toast('Mật khẩu xác nhận không khớp', 'error'); return; }

    try {
        const res = await fetch(`${API_URL}/users/me/password`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ old_password: oldP, new_password: newP })
        });
        const json = await res.json();
        if (!res.ok) {
            toast(json.error || 'Lỗi', 'error');
            return;
        }
        toast('Đổi mật khẩu thành công!');
        document.getElementById('old-pass').value = '';
        document.getElementById('new-pass').value = '';
        document.getElementById('confirm-pass').value = '';
    } catch (e) {
        toast('Lỗi kết nối', 'error');
    }
}

// ============================================================
// ĐƠN HÀNG
// ============================================================
async function loadMyOrders() {
    try {
        const res = await fetch(`${API_URL}/orders/my-orders`, { headers: authHeaders() });
        const json = await res.json();
        allOrders = json.data || json;
        renderOrders();
    } catch (e) {
        toast('Lỗi tải đơn hàng', 'error');
    }
}

function filterOrders(status, btn) {
    currentFilter = status;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderOrders();
}

function renderOrders() {
    const container = document.getElementById('orders-list');
    let list = allOrders;
    if (currentFilter !== 'all') {
        list = list.filter(o => o.status === currentFilter);
    }

    if (list.length === 0) {
        container.innerHTML = `<div class="empty"><div class="icon">📦</div><p>Không có đơn hàng nào</p></div>`;
        return;
    }

    container.innerHTML = list.map(o => {
        const badgeClass = {
            'Chờ xử lý': 'pending',
            'Đã xác nhận': 'confirmed',
            'Chờ lấy hàng': 'waiting',
            'Đang giao': 'shipping',
            'Hoàn thành': 'completed',
            'Đã hủy': 'cancelled'
        }[o.status] || 'pending';

        const itemsHtml = (o.items || []).map(it => {
            const thumb = it.image_url
                ? `<img src="${it.image_url}" onerror="this.style.display='none'">`
                : '🛍️';
            return `
                <div class="order-line">
                    <div class="thumb">${thumb}</div>
                    <div class="info">
                        <div class="name">${it.name}</div>
                        <div class="qty">Số lượng: ${it.quantity}</div>
                    </div>
                    <div class="price">${fmtMoney(it.price * it.quantity)}</div>
                </div>
            `;
        }).join('');

        let actions = '';

        if (o.status !== 'Đã hủy') {
            actions += `<a href="order-tracking.html?id=${o.id}" class="btn btn-outline">Theo Dõi</a>`;
        }
        actions += `<a href="order-detail.html?id=${o.id}" class="btn btn-outline">Chi Tiết</a>`;

        if (['Chờ xử lý', 'Đã xác nhận', 'Chờ lấy hàng'].includes(o.status)) {
            actions += `<button class="btn btn-danger" onclick="openCancelModal(${o.id})">Hủy Đơn</button>`;
        }

        if (o.status === 'Đang giao') {
            actions += `<button class="btn btn-success" onclick="confirmReceived(${o.id})">Đã Nhận</button>`;
        }

        return `
            <div class="order-item">
                <div class="order-top">
                    <div>
                        <div class="order-id">
                            #${o.id}
                            ${o.is_fragile ? '<span class="tag-fragile">Hàng dễ vỡ</span>' : ''}
                        </div>
                        <div class="order-time">${new Date(o.created_at).toLocaleString('vi-VN')}</div>
                    </div>
                    <span class="badge ${badgeClass}">${o.status}</span>
                </div>
                <div class="order-items-list">${itemsHtml}</div>
                <div class="order-bottom">
                    <div class="order-total">Tổng: <span>${fmtMoney(o.total_amount)}</span></div>
                    <div class="order-actions">${actions}</div>
                </div>
            </div>
        `;
    }).join('');
}

function openCancelModal(orderId) {
    document.getElementById('cancel-order-id').value = orderId;
    document.getElementById('cancel-reason').value = '';
    document.getElementById('cancel-modal').classList.add('open');
}

function closeCancelModal() {
    document.getElementById('cancel-modal').classList.remove('open');
}

async function confirmCancel() {
    const orderId = document.getElementById('cancel-order-id').value;
    const reason = document.getElementById('cancel-reason').value.trim();

    try {
        const res = await fetch(`${API_URL}/orders/${orderId}/cancel`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ reason: reason || 'Khách hủy' })
        });
        const json = await res.json();
        if (!res.ok) {
            toast(json.error || 'Lỗi', 'error');
            return;
        }
        toast('Đã hủy đơn hàng');
        closeCancelModal();
        loadMyOrders();
    } catch (e) {
        toast('Lỗi kết nối', 'error');
    }
}

async function confirmReceived(id) {
    if (!confirm('Xác nhận đã nhận hàng?')) return;
    try {
        const res = await fetch(`${API_URL}/orders/${id}/confirm-received`, {
            method: 'PUT',
            headers: authHeaders()
        });
        const json = await res.json();
        if (!res.ok) {
            toast(json.error || 'Lỗi', 'error');
            return;
        }
        toast('Cảm ơn bạn đã mua hàng!');
        loadMyOrders();
    } catch (e) {
        toast('Lỗi kết nối', 'error');
    }
}

window.onload = loadProfile;
</script>
