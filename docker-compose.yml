version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: beepimart_db
    restart: always
    environment:
      POSTGRES_USER: beepi_admin
      POSTGRES_PASSWORD: BeepiSecurePassword2026
      POSTGRES_DB: beepimart_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    networks:
      beepi_net:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beepi_admin -d beepimart_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: beepimart_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      DB_HOST: 172.20.0.2
      DB_USER: beepi_admin
      DB_PASSWORD: BeepiSecurePassword2026
      DB_NAME: beepimart_db
      DB_PORT: 5432
      PORT: 5000
      JWT_SECRET: BeePiMart_Production_Secret_2026_Change_Me
      BCRYPT_COST: 10
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      beepi_net:
        ipv4_address: 172.20.0.3
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: beepimart_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      beepi_net:
        ipv4_address: 172.20.0.4

networks:
  beepi_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pgdata: